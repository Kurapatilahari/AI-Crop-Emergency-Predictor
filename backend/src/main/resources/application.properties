spring.application.name=crop-emergency-predictor
server.port=8080
server.error.include-message=always

# ---------- MySQL ----------
# The database is created automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/crop_emergency_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ---------- JWT ----------
# Base64 secret (>= 256 bits). Override with env var JWT_SECRET in production.
jwt.secret=${JWT_SECRET:e/D0ztBwhZc+3GvVuX9RJOwPbq2qo+Ya/nCfRluf5eRcdnCKEhkEh7YqxNexlAQO}
jwt.expiration-ms=86400000

# ---------- App ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Free weather forecast from Open-Meteo (no API key). Falls back gracefully if offline.
app.weather.enabled=true
# Daily automatic prediction run for every field (06:00 server time)
app.scheduler.cron=0 0 6 * * *
# Set true and plug a provider (Twilio / MSG91) into NotificationService to send real SMS/voice
app.notifications.sms-enabled=false
